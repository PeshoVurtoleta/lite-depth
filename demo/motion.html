<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lite-depth // MOTION — timeline scrubber</title>
<style>
  :root {
    --bg: #04140b; --bg2: #061c10;
    --ink: #7dffb0; --ink2: #35c47a; --dim: #1c6b41;
    --grid: #0c3a22; --warn: #ffd166; --hot: #ff6b8b;
    --ink-oklch: oklch(0.9 0.17 155); --dim-oklch: oklch(0.55 0.12 155);
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); }
  body {
    background-image:
      repeating-linear-gradient(0deg, transparent 0, transparent 1.4rem, var(--grid) 1.4rem, var(--grid) calc(1.4rem + 1px)),
      repeating-linear-gradient(90deg, transparent 0, transparent 1.4rem, var(--grid) 1.4rem, var(--grid) calc(1.4rem + 1px));
    display: grid; grid-template-rows: auto 1fr auto; gap: 0.75rem; padding: 0.9rem; overflow: hidden;
  }
  header { display: flex; align-items: baseline; gap: 0.8rem; flex-wrap: wrap; }
  h1 { font-size: 0.95rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); }
  h1 b { color: var(--warn); }
  .sub { font-size: 0.72rem; color: var(--dim-oklch, var(--dim)); letter-spacing: 0.05em; }
  main { position: relative; border: 1px solid var(--dim); border-radius: 0.4rem; overflow: hidden; background: radial-gradient(circle at 50% 40%, var(--bg2), var(--bg)); }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; top: 0.6rem; left: 0.6rem; font-size: 0.7rem; line-height: 1.5; color: var(--ink-oklch, var(--ink)); text-shadow: 0 0 6px var(--dim); pointer-events: none; }
  .hud .k { color: var(--dim-oklch, var(--dim)); }
  .hud b { color: var(--warn); font-weight: 400; }
  footer { display: grid; gap: 0.55rem; }
  .track { display: flex; align-items: center; gap: 0.7rem; }
  .track input[type="range"] { flex: 1; accent-color: var(--ink); height: 1.1rem; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  button, select {
    font-family: var(--mono); font-size: 0.72rem; color: var(--ink); background: var(--bg2);
    border: 1px solid var(--dim); border-radius: 0.3rem; padding: 0.35rem 0.7rem; letter-spacing: 0.05em; cursor: pointer;
  }
  button:is(.on) { color: var(--bg); background: var(--ink); border-color: var(--ink); }
  @media (hover: hover) { button:hover, select:hover { border-color: var(--ink2); } }
  label.f { font-size: 0.7rem; color: var(--dim-oklch, var(--dim)); display: inline-flex; gap: 0.35rem; align-items: center; }
  .clock { font-variant-numeric: tabular-nums; color: var(--warn); min-width: 3.5rem; text-align: right; }
</style>
</head>
<body>
<header>
  <h1>lite-depth // <b>MOTION</b></h1>
  <span class="sub">zero-GC keyframe mixer · clock-driven · quaternion slerp · scrub the timeline</span>
</header>

<main>
  <canvas id="c"></canvas>
  <div class="hud">
    <div><span class="k">t</span> <b id="hT">0.00</b><span class="k">s / </span><b id="hD">0.0</b><span class="k">s</span></div>
    <div><span class="k">clips</span> <b id="hC">0</b> <span class="k">· faces</span> <b id="hF">0</b> <span class="k">· culled</span> <b id="hK">0</b></div>
    <div><span class="k">draws</span> <b id="hDr">0</b> <span class="k">· sort</span> <b id="hS">0.00</b><span class="k">ms</span></div>
  </div>
</main>

<footer>
  <div class="track">
    <button id="play" class="on">⏸ pause</button>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <span class="clock" id="clk">0.00s</span>
  </div>
  <div class="row">
    <label class="f">loop
      <select id="loop"><option value="pingpong">pingpong</option><option value="loop">loop</option><option value="once">once</option></select>
    </label>
    <label class="f">rate
      <select id="rate"><option value="1">1.0×</option><option value="0.5">0.5×</option><option value="2">2.0×</option><option value="0.25">0.25×</option></select>
    </label>
    <label class="f">props
      <select id="count"><option value="12">12</option><option value="32">32</option><option value="64">64</option></select>
    </label>
    <button id="rebuild">↻ rebuild</button>
  </div>
</footer>

<script type="importmap">
{
  "imports": {
    "@zakkster/lite-depth": "../Depth.js",
    "@zakkster/lite-depth/motion": "../Motion.js",
    "@zakkster/lite-arena": "https://esm.sh/@zakkster/lite-arena@1",
    "@zakkster/lite-fastbit32": "https://esm.sh/@zakkster/lite-fastbit32@1",
    "@zakkster/lite-aabb": "https://esm.sh/@zakkster/lite-aabb@1",
    "@zakkster/lite-keyframe": "https://esm.sh/@zakkster/lite-keyframe@1",
    "@zakkster/lite-ease": "https://esm.sh/@zakkster/lite-ease@1"
  }
}
</script>

<script type="module">
import { createStage, geometry, materialFromRamp, updateCamera } from '@zakkster/lite-depth';
import { createMixer } from '@zakkster/lite-depth/motion';

const TAU = Math.PI * 2;

/* cached DOM refs (module-init, never per-frame) */
const $c = document.getElementById('c');
const $ctx = $c.getContext('2d');
const $play = document.getElementById('play');
const $scrub = document.getElementById('scrub');
const $clk = document.getElementById('clk');
const $loop = document.getElementById('loop');
const $rate = document.getElementById('rate');
const $count = document.getElementById('count');
const $rebuild = document.getElementById('rebuild');
const $hT = document.getElementById('hT'), $hD = document.getElementById('hD');
const $hC = document.getElementById('hC'), $hF = document.getElementById('hF');
const $hK = document.getElementById('hK'), $hDr = document.getElementById('hDr'), $hS = document.getElementById('hS');

/* throttled textContent write (touches DOM only on change) */
const hud = ($el, v) => { if ($el._v !== v) { $el._v = v; $el.textContent = v; } };
const f2 = (x) => (Math.round(x * 100) / 100).toFixed(2);
const f1 = (x) => (Math.round(x * 10) / 10).toFixed(1);

const MAX = 96;
let stage, mixer, DUR = 4, simT = 0, playing = true;

/* colour ramp materials (pre-baked LUTs) */
const ramp = (h) => { const out = []; for (let i = 0; i < 24; i++) { const l = 0.25 + 0.6 * (i / 23); out.push(oklchHex(l, 0.15, h)); } return out; };
function oklchHex(l, c, h) { // tiny oklch->sRGB for the demo palette
  const hr = h * Math.PI / 180, a = c * Math.cos(hr), b = c * Math.sin(hr);
  let L = l + 0.3963377774 * a + 0.2158037573 * b, M = l - 0.1055613458 * a - 0.0638541728 * b, S = l - 0.0894841775 * a - 1.291485548 * b;
  L = L * L * L; M = M * M * M; S = S * S * S;
  let r = +4.0767416621 * L - 3.3077115913 * M + 0.2309699292 * S;
  let g = -1.2684380046 * L + 2.6097574011 * M - 0.3413193965 * S;
  let bl = -0.0041960863 * L - 0.7034186147 * M + 1.707614701 * S;
  const to = (x) => { x = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(Math.max(x, 0), 1 / 2.4) - 0.055; return ('0' + Math.round(Math.min(1, Math.max(0, x)) * 255).toString(16)).slice(-2); };
  return '#' + to(r) + to(g) + to(bl);
}

function build(n) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = $c.clientWidth, h = $c.clientHeight;
  stage = createStage($ctx, { width: w, height: h, dpr, maxNodes: MAX + 4, maxVerts: (MAX + 4) * 40, maxDrawFaces: (MAX + 4) * 40, camera: { radius: 14, theta: 0.7, phi: 1.02, near: 0.4, far: 120 } });
  const gBox = stage.geometry(geometry.box(1, 1, 1));
  const gOct = stage.geometry(geometry.sphere(0.75, 6, 4));
  const mats = [stage.material(materialFromRamp(ramp(155))), stage.material(materialFromRamp(ramp(45))), stage.material(materialFromRamp(ramp(320)))];
  mixer = createMixer(stage, { maxClips: MAX + 4 });
  DUR = 4;
  const loop = $loop.value, rate = +$rate.value;
  const R = 6.5;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, r = R * (0.5 + 0.5 * ((i * 7) % n) / n);
    const node = stage.addNode((i & 1) ? gBox : gOct, mats[i % 3], {});
    const x0 = Math.cos(a) * r, z0 = Math.sin(a) * r;
    mixer.clip(node)
      .posKey(0, x0, -4, z0)
      .posKey(DUR * 0.5, x0 * 0.3, 3.5, z0 * 0.3, 'easeOutCubic')
      .posKey(DUR, x0, -4, z0, 'easeInCubic')
      .quatEuler(0, 0, 0, 0)
      .quatEuler(DUR * 0.5, Math.PI, a, 0, 'easeInOutCubic')
      .quatEuler(DUR, TAU, TAU, 0, 'easeOutCubic')
      .scaleKey(0, 0.6).scaleKey(DUR * 0.5, 1.5, 'easeInOutSine').scaleKey(DUR, 0.6, 'easeInOutSine')
      .play({ duration: DUR, loop, timescale: rate });
  }
  simT = 0;
}

function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = $c.clientWidth, h = $c.clientHeight;
  if ($c.width !== (w * dpr | 0) || $c.height !== (h * dpr | 0)) { $c.width = w * dpr | 0; $c.height = h * dpr | 0; if (stage) stage.resize(w, h, dpr); }
}

/* ── zero-alloc frame loop ── */
let last = performance.now(), frameN = 0;
function frame(now) {
  fit();
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const once = $loop.value === 'once', period = ($loop.value === 'pingpong') ? DUR * 2 : DUR;
  // once plays to the end and stops (the mixer re-arms on a backward scrub);
  // loop/pingpong wrap. All modes drive the mixer to absolute simT below.
  if (playing) { simT += dt; if (once) { if (simT > DUR) simT = DUR; } else if (simT > period) simT -= period; }
  mixer.update(simT - mixer.time);
  stage.camera.theta += dt * 0.15; updateCamera(stage.camera);
  const s = stage.frame(16);
  // telemetry: toFixed + textContent both allocate, so gate to ~10Hz -- never per frame
  if ((frameN & 7) === 0) {
    hud($hT, f2(simT)); hud($hD, f1(DUR)); hud($hC, mixer.clipCount);
    hud($hF, s.facesDrawn); hud($hK, s.facesCulled); hud($hDr, s.drawCalls); hud($hS, f2(s.tSort));
    hud($clk, f2(simT) + 's');
  }
  if (!$scrub._drag) $scrub.value = (simT / period * 1000) | 0;
  frameN++;
  requestAnimationFrame(frame);
}

/* controls */
$play.addEventListener('click', () => { playing = !playing; $play.classList.toggle('on', playing); $play.textContent = playing ? '⏸ pause' : '▶ play'; });
$scrub.addEventListener('pointerdown', () => { $scrub._drag = true; playing = false; $play.classList.remove('on'); $play.textContent = '▶ play'; });
$scrub.addEventListener('pointerup', () => { $scrub._drag = false; });
$scrub.addEventListener('input', () => { const period = ($loop.value === 'pingpong') ? DUR * 2 : DUR; simT = (+$scrub.value / 1000) * period; });
$loop.addEventListener('change', () => build(+$count.value));
$rate.addEventListener('change', () => build(+$count.value));
$count.addEventListener('change', () => build(+$count.value));
$rebuild.addEventListener('click', () => build(+$count.value));
window.addEventListener('resize', fit);

/* boot */
fit();
build(+$count.value);
requestAnimationFrame(frame);
</script>
</body>
</html>
